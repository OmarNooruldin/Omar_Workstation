<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 2</title>
  </head>
  <body>
    <header></header>
    <main>
      <div
        style="
          background-color: rgb(207, 194, 14);
          border: 2px solid;
          border-radius: 5px;
          margin-right: 1000px;
        "
      >
        <form id="form">
          <label for="name">Name</label>
          <input type="text" name="name" id="name" />
          <br />
          <label for="email">Email</label>
          <input type="email" name="email" id="email" />
          <br />
          <label for="phone">Phone</label>
          <input type="number" name="phone" id="phone" />
          <br />
          <button onclick="SubmitData()">Sumbit</button>
        </form>
      </div>

      <script>
        function SubmitData() {
          const vaildation = true;
          const text = document.getElementById("name").value;
          const email = document.getElementById("email").value;
          const phone = document.getElementById("phone").value;

          if (vaildation == true) {
            if (text === "" || email === "" || phone === "") {
              alert("You have to Enter Data as required");
              vaildation = false;
            } else {
              vaildation = true;
            }
          }
        }
      </script>
    </main>
    <footer></footer>
  </body>
</html>
