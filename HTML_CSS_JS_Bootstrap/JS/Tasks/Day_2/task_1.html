<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 1</title>
        <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f9fafb;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: #3b82f6;
        }
        .counter-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
            font-size: 14px;
            color: #6b7280;
        }
        .warning {
            color: #dc2626;
            font-weight: bold;
        }
    </style>
  </head>
  <body>
    <header></header>
    <main>
      <div class="container">
    <label for="message">Your Message</label>
    <!-- The HTML maxlength attribute prevents typing past the limit natively -->
    <textarea id="message" maxlength="100" placeholder="Start typing here..."></textarea>
    
    <div class="counter-container">
        <!-- aria-live updates screen readers dynamically for accessibility -->
        <span id="counter" aria-live="polite">100 characters remaining</span>
    </div>
</div>
<script>
    const textarea = document.getElementById('message');
    const counter = document.getElementById('counter');
    const maxChars = 100;

    textarea.addEventListener('input', () => {
        const remaining = maxChars - textarea.value.length;
        
        // Update remaining text display
        counter.textContent = `${remaining} character${remaining === 1 ? '' : 's'} remaining`;
        
        // Add visual indicator class if user drops below 10 remaining characters
        if (remaining <= 10) {
            counter.classList.add('warning');
        } else {
            counter.classList.remove('warning');
        }
    });
</script>
    </main>
    <footer></footer>
  </body>
</html>
