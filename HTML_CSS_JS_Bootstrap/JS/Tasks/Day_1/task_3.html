<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 3</title>
  </head>
  <body>
    <div>
      <h2>Task 3</h2>
      <button onclick="greetByTime()">Greeting Me</button>
      <div id="result"></div>
      
      <script>
        function greetByTime() {
          const hour = new Date().getHours();
          let greeting = "";

          if (hour < 12) {
            greeting = `The time is ${hour} \n Good Morning :)`;
          } else if (hour < 18) {
            greeting = `The time is ${hour} \n Good Afternoon :)`;
          } else {
            greeting = `The time is ${hour} \n Good Evening `;
          }
          document.getElementById("result").innerText = greeting;
        }
      </script>
    </div>
  </body>
</html>
