<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 4</title>
  </head>
  <body>
    <div>
      <h2>Task 4</h2>
      <label for="name">Name : </label>
      <input type="text" id="name">
      <button onclick="greetByMe()">Greeting Me</button>
      <div id="result"></div>

      <script>        

        function greetByMe() {

          const name = document.getElementById("name").value;
          const hour = new Date().getHours();
          let greeting = "";

          if (hour < 12) {
            greeting = `The Time is ${hour} \n Good Morning, `;
          } else if (hour < 18) {
            greeting = `The Time is ${hour} \n Good Afternoon, `;
          } else {
            greeting = `The Time is ${hour} \n Good Evening, `;
          }
          document.getElementById("result").innerText = greeting + name;
        }
      </script>
    </div>
  </body>
</html>
