    <div>
        <label for="grade">Enter Grade</label>
        <input type="number" name="grade" id="grade">
        <button onclick="GetGrade()">Get Grade</button>

        <div id="result1" style="background-color: rgb(247, 4, 4); color: aliceblue;"></div>

        <script>
            function GetGrade() 
            {
                let grade = document.getElementById('grade').value;

              if (grade >= 90)
            {
                document.getElementById("result1").innerHTML = "Excellent";
            } else if (grade >= 70)
            {
                document.getElementById("result1").innerHTML = "Very Good";
            } else
            {
                document.getElementById("result1").innerHTML = "Keep Trying";
            }
            }
        </script>
    </div>
