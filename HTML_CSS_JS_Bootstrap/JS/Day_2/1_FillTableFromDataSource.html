<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fill Data</title>
  </head>
  <body>
    <div>
      <h2>From Array</h2>
      <table border="2" id="studentTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Grade</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <script>
        const student = [
          { name: "Ahmed", age: 30, grade: "A+" },
          { name: "Fatimah", age: 24, grade: "A" },
          { name: "Omar", age: 26, grade: "B" },
          { name: "Mohammed", age: 28, grade: "C" },
        ];
        const tableBody = document.querySelector("#studentTable tbody");

        for (let i = 0; i < student.length; i++) {
          const row = document.createElement("tr");
          row.innerHTML = `
            <tr>
                <td>${student[i].name}</td>
                <td>${student[i].age}</td>
                <td>${student[i].grade}</td>
            </tr>
            `;
          tableBody.appendChild(row);
        }
      </script>
    </div>
    <hr />
    <div>
      <h2>Student List</h2>
      <table id="GradeTable" border="2">
        <thead>
          <tr>
            <th>Name</th>
            <th>Grade</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <script>
        const students = [
          { name_1: "Ali", grade_1: 90 },
          { name_1: "Sara", grade_1: 85 },
          { name_1: "Omar", grade_1: 78 },
        ];
        const BodyTable = document.querySelector("#GradeTable tbody");
        for (let x = 0; x < students.length; x++) {
          const row1 = document.createElement("tr");
          row1.innerHTML = `
            <tr>
                <td>${students[x].name_1}</td>
                <td>${students[x].grade_1}</td>
            </tr>
            `;
          BodyTable.appendChild(row1);
        }
      </script>
    </div>
    <hr />
    <div>
      <h2>Student List 2</h2>
      <table border="2">
        <thead>
          <tr>
            <th>Name</th>
            <th>Grade</th>
          </tr>
        </thead>
        <tbody id="TableBody"></tbody>
      </table>
      <script>
        const studentss = [
          { name_2: "Ahmed", grade_2: 100 },
          { name_2: "Fatimah", grade_2: 95 },
          { name_2: "Omar", grade_2: 90 },
        ];
        const Table = document.getElementById("TableBody");
        for (let y = 0; y < studentss.length; y++) {
          const row2 = document.createElement("tr");
          row2.innerHTML = `
            <tr>
                <td>${studentss[y].name_2}</td>
                <td>${studentss[y].grade_2}</td>
            </tr>
            `;
          Table.appendChild(row2);
        }
      </script>
    </div>
    <hr />

    <div>
      <h2>Fetch Data From API</h2>
      <button onclick="LoadData()">Load</button>
      <br /><br />
      <table id="userTable" border="2">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>City</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <script>
        async function LoadData() {
          const response = await fetch(
            "https://jsonplaceholder.typicode.com/users",
          );
          const users = await response.json();

          const tbody = document.querySelector("#userTable tbody");
          tbody.innerHTML = "";

          users.forEach((user) => {
            const row3 = document.createElement("tr");
            row3.innerHTML = `
                <td>${user.name}</td>
                <td>${user.email}</td>
                <td>${user.address.city}</td>
            `;
            tbody.appendChild(row3);
          });
        }
      </script>
    </div>
    <hr />

    <div></div>
  </body>
</html>
