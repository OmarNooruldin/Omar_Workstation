<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Forms </title>
    <link rel="stylesheet" href="Style_day_1.css">
</head>
<body>
    <form>
        <label for="name">Name :</label>
        <input type="text"  id="name">
      <br>
        <label for="email">Email: </label>
        <input type="email"  id="email">
        <br>
        <label for="password">Password: </label>
        <input type="password"  id="password">
      <br>
        <label for="bd">Birth Date: </label>
        <input type="date"  id="bd">
        <br>
        <label for="color">Color: </label>
        <input type="color"  id="color">
      <br>
        <label for="range">Range: </label>
        <input type="range"  id="range" min="0" max="100">
        <br>
        <label for="number" style="margin-right: 10% ;">Number:</label>
        <input type="number"  id="number" min="0" max="255">
      <br>
        <label for="phone" style="margin-right: 7% ;">Phone: </label>
        <input type="tel"  id="phone">
        <br>
        <label for="file" style="margin-right: 5%;">Upload: </label>
        <input type="file"  id="file">
      <br>
        <button type="submit"> Submit </button>
    </form>
</body>
</html>
