<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Table 1 </title>
<link rel="stylesheet" href="Style_day_1.css">
</head>
<body>
    <h1> Simple Table </h1>
    <table border="4">
     
     <tr> 
        <th> Name </th>
        <th> Age </th>
        <th> Grade </th>
     </tr>

     <tr>
       <td rowspan="2"> Omar </td>
       <td> 26 </td>
       <td> 95 </td>
     </tr>
     
     <tr>
        <td> 26 </td>
        <td> 98 </td>
     </tr>
     <tr>
        <td colspan="2"> Ahmed </td>
        <td> 28 , 100 </td>
    </tr>

    <tr>
         <td> Fatimah </td>
         <td> 22 </td>
         <td> 99 </td>
     </tr>

    </table>
</body>
</html>
