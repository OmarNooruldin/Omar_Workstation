    <main>
      <section
        style="max-width: 500px; border: 1px solid #000000; padding: 20px">
        <form id="Settings">
          <label for="language"> Language :</label><br />
          <select id="language">
            <option value="ar" selected>Arabic</option>
            <option value="en">English</option>
          </select>
          <br /><br />

          <label>Notifications :</label><br />
          <input type="checkbox" id="notify_email" checked /> Email <br />
          <input type="checkbox" id="notify_sms" /> SMS <br /><br />

          <label>Theme :</label><br />
          <input type="radio" name="theme" value="light" checked /> Light<br />
          <input type="radio" name="theme" value="dark" /> Dark<br /><br />

          <button type="submit">Save Settings</button>
        </form>
      </section>
    </main>
