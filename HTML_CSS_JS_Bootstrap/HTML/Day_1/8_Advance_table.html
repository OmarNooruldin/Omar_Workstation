<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Advance table </title>
</head>
<body>
    <table border="2">
        <tr>
          <th>Name</th>
          <th colspan="2">Grade</th>
        </tr>

        <tr>
            <td rowspan="2">Omar</td>
            <td>Computer</td>
            <td> 85 </td>
        </tr>
        
        <tr>
            <td> Programming </td>
            <td> 95 </td>
        </tr>        
    </table>
</body>
</html>
