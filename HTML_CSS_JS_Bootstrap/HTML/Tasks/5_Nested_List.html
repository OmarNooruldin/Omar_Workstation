<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested List</title>
</head>
<body>
    <h2>Study Plan</h2>
    <hr>
    <br>
    <div>
        <h3>Monday</h3>
        <input type="checkbox" name="Study" value="HTML" id="Html">
      <label for="HTML">HTML</label>
      <input type="checkbox" name="Study" value="CSS" id="CSS">
      <label for="CSS">CSS</label> 
      <input type="checkbox" name="Study" value="JS" id="JS" >
      <label for="JS">JS</label>
    </div>
    <div>
        <h3>Tuesday</h3>
          <input type="checkbox" name="Study" value="SQL" id="SQL">
      <label for="SQL">SQL</label>
      <input type="checkbox" name="Study" value="C#" id="C#">
      <label for="C#">C#</label> 
    </div>
</body>
</html>
