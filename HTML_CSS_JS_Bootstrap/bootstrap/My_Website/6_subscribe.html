            <div class="container m-3">
            <div class="card bg-primary text-white">
            <div class="card-body">
                <label for="fullname">Full Name :</label><br>
                <input type="text" id="fullname" name="fullname" required><br><br>

                <label for="email">Email :</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="card">Card Number :</label><br>
                <input type="text" id="card" name="card" placeholder="**** **** **** ****" required><br><br>

                <label for="expiry">Card Expiry Date :</label><br>
                <input type="month" id="expiry" name="expiry" required><br><br>

                <label for="cvv">CVV :</label><br>
                <input type="password" id="cvv" name="cvv" maxlength="4" required><br><br>

                <button type="submit">Submit </button>
